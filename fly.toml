app = "forgotten-app"
primary_region = "gru"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 10
    hard_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[[mounts]]
  source = "forgotten_data"
  destination = "/data"

[processes]
  app = "uvicorn src.app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m scripts.run_worker"
