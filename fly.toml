app = "forgotten-app"
primary_region = "gru"


[processes]
  app = "/start.sh"
  worker = "python -m scripts.run_worker"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    soft_limit = 10
    hard_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4096mb"

[[mounts]]
  source = "forgotten_data"
  destination = "/data"
