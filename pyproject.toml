[project]
name = "ProtoType"
version = "0.1.0"
requires-python = ">=3.12.12"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "starlette>=0.40.0,<0.49.0",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.10.0",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "prometheus-fastapi-instrumentator>=7.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "passlib[bcrypt]>=1.7",
  "dramatiq[redis]>=1.16",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3.0",
  "yt-dlp==2024.10.22",
  "youtube-transcript-api>=0.6.0",
  "openai>=1.0.0",
  "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-playwright>=0.4.4",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
  "trio>=0.23",
  "testcontainers[postgres]>=4.8.2",
  "black>=24.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
  "bandit>=1.7",
  "pre-commit>=3.7",
  "playwright>=1.48",
]

[tool.black]
line-length = 100
target-version = ["py312"]

# --- Ruff: migrate to new 'lint' section + keep FastAPI idiom ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM","ARG","PL"]
ignore = ["E203","E266","E501","B008"]  # B008 (Depends in params) is idiomatic FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004","SIM117"]  # optional: ignore test nits if you didn't refactor tests
"alembic/*" = ["SIM105"]          # harmless if left after fix

# --- Mypy: exclude alembic shims ---
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
strict_equality = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
addopts = [
  "--cov=src",
  "--cov=tests",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "no_db_override: run test without overriding database dependencies",
  "integration: tests that hit real services (Postgres, etc.)",
  "system: end-to-end FastAPI API flows with real wiring",
  "ui: optional browser automation smoke tests",
  "regression: deep pipeline regression tests with stubbed externals",
]
filterwarnings = [
  "ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.utils",
  "ignore:The @wait_container_is_ready decorator is deprecated and will be removed in a future version:DeprecationWarning:testcontainers.*",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
