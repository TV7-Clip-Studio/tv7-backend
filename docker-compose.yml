services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/appdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      PYTHONPATH: src
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir src --reload
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on: [postgres, redis]
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./media:/app/media

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/appdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DRAMATIQ_BROKER: ${DRAMATIQ_BROKER:-redis}
      PYTHONPATH: src
    command: python -m scripts.run_worker
    depends_on: [postgres, redis]
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./media:/app/media

volumes:
  pgdata:
