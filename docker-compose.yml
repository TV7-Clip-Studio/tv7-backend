services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/appdb}
      PYTHONPATH: src
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir src
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on: [postgres]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
