<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV7 Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; }
    header { background: #111827; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
    nav a { color: #cbd5e1; margin-right: 16px; text-decoration: none; }
    nav a:hover { color: #60a5fa; }
    .container { padding: 24px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #1f2937; }
    th { color: #cbd5e1; }
    input, select, button { background: #0b1220; color: #e2e8f0; border: 1px solid #1f2937; border-radius: 4px; padding: 8px; }
    button { cursor: pointer; }
    .error { color: #f87171; margin-top: 8px; }
    .muted { color: #94a3b8; font-size: 0.9rem; }
    .status { display: inline-block; border-radius: 4px; padding: 3px 7px; font-size: 0.75rem; font-weight: 700; }
    .status-ready { background: #064e3b; color: #6ee7b7; }
    .status-warning { background: #422006; color: #fcd34d; }
    .status-inactive { background: #450a0a; color: #fca5a5; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div><strong>TV7 Admin</strong></div>
    {% if admin_user %}
    <nav>
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/schedule">Schedule</a>
      <a href="/admin/cloud-ai">Cloud AI</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/logout">Logout</a>
    </nav>
    {% endif %}
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
