{% extends "admin/base.html" %}

{% block title %}Sign In · Shorts Factory{% endblock %}

{% block content %}
  <section class="card" style="max-width: 420px; margin: 4rem auto;">
    <h1 style="margin-top: 0; font-size: 1.75rem;">Operator Sign In</h1>
    <p style="color: #94a3b8; margin-bottom: 1.5rem;">
      Sign in with your Shorts Factory account to access the dashboard.
    </p>
    {% if error %}
      <div class="flash error" style="margin-bottom: 1rem;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login" class="stack">
      <label>
        <span>Email</span>
        <input type="email" name="email" value="{{ email or '' }}" required
               style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 0.75rem; border: 1px solid rgba(148,163,184,0.3); background: rgba(15,23,42,0.6); color: inherit;">
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required
               style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 0.75rem; border: 1px solid rgba(148,163,184,0.3); background: rgba(15,23,42,0.6); color: inherit;">
      </label>
      <button class="btn" type="submit">Sign In</button>
    </form>
  </section>
{% endblock %}
