name: CI
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12.12" }
      - name: Fetch tv7-core (sibling)
        run: git clone --depth 1 https://github.com/TV7-Clip-Studio/tv7-core.git ../tv7-core
      - run: make deps
      - run: make fmt && make lint && make type && make sec
      - run: make testcov
