default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks: [{id: black}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks: [{id: ruff, args: ["--fix"]}]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks: [{id: mypy, additional_dependencies: []}]
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-r", "src"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pytest-coverage
        name: pytest with coverage
        entry: .venv/bin/python
        language: system
        pass_filenames: false
        args:
          - "-m"
          - pytest
          - "--cov=src"
          - "--cov=tests"
          - "--cov-report=term-missing"
          - "--cov-fail-under=85"
      - id: make-ci-checks-pre-push
        name: make fmt/lint/type/sec (pre-push)
        entry: bash -ec 'make fmt && make lint && make type && make sec'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
